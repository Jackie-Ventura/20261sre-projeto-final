name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock

    - name: Create .env file
      run: |
        echo "CLICKHOUSE_HOST=clickhouse-northwind" > .env
        echo "CLICKHOUSE_PORT=8123" >> .env
        echo "CLICKHOUSE_USER=default" >> .env
        echo "CLICKHOUSE_PASSWORD=northwind" >> .env
        echo "CLICKHOUSE_DB=northwind" >> .env
        echo "MINIO_ENDPOINT=minio-northwind:9000" >> .env
        echo "MINIO_ACCESS_KEY=minio_user" >> .env
        echo "MINIO_SECRET_KEY=minio_password" >> .env
        echo "CSV_DATA_DIR=dados_northwind" >> .env

    - name: Start Infrastructure
      run: docker compose up -d --build

    - name: Wait for services to be healthy
      run: |
        echo "Waiting for ClickHouse and MinIO to be healthy..."
        for i in {1..30}; do
          if [ "$(docker inspect -f '{{.State.Health.Status}}' clickhouse-northwind)" == "healthy" ] && \
             [ "$(docker inspect -f '{{.State.Health.Status}}' minio-northwind)" == "healthy" ]; then
            echo "Services are healthy!"
            exit 0
          fi
          sleep 5
        done
        echo "Services failed to become healthy"
        docker compose ps
        docker compose logs
        exit 1

    - name: Run Setup
      run: docker compose exec -t app ./setup.sh

    - name: Run Tests
      run: docker compose exec -t app pytest tests/
